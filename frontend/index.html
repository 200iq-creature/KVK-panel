<!doctype html>
<html lang="ru" class="h1 dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<title>KVK Panel</title>
<script>
(function(){try{var t=localStorage.getItem('kvk-theme')||'dark';var d=t==='dark'||t==='hacker'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.className=['h1',d?'dark':'',t==='hacker'?'hack':''].filter(Boolean).join(' ')}catch(e){}})();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
