name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.5' }
      - name: Build web UI
        run: cd frontend && npm ci && npx vite build
      - name: Build binaries
        run: |
          VER=$(tr -d ' \n\r' < VERSION)
          mkdir -p release
          for t in amd64: arm64: armv7:7; do
            name=${t%%:*}; goarm=${t#*:}; goarch=$name; [ "$name" = armv7 ] && goarch=arm
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch GOARM=$goarm go build -trimpath \
              -ldflags "-s -w -X github.com/200iq-creature/KVK-panel/internal/app.Version=$VER" -o kvk-panel ./cmd/kvk-panel
            tar -czf release/kvk-panel-linux-$name.tar.gz kvk-panel
            rm kvk-panel
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.tar.gz
